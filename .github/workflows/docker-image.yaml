name: Docker Image CI

on:
  push:
    tags: [ '*.*.*' ]
    paths: [ 'Dockerfile', '.github/workflows/docker-image.yaml' ]
    branches: [ master ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ghcr.io registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          pull: true
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,"name=sdvcrx/hugo-firebase,ghcr.io/sdvcrx/hugo-firebase",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ghcr.io registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and inspect manifests
        working-directory: ${{ runner.temp }}/digests
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag=latest
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          shopt -s nullglob
          digests=(*)
          [ "${#digests[@]}" -eq 2 ]
          for image in sdvcrx/hugo-firebase ghcr.io/sdvcrx/hugo-firebase; do
            sources=()
            for digest in "${digests[@]}"; do
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
              sources+=("$image@sha256:$digest")
            done
            docker buildx imagetools create --tag "$image:$tag" "${sources[@]}"
            docker buildx imagetools inspect "$image:$tag"
          done
